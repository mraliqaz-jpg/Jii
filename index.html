/* ---------- أدوات مساعدة ---------- */
const cleanName = (n) => (n || '').replace(/[\\/:*?"<>|]+/g, '-').trim() || 'ملف';
const localISO = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const parseISO = (iso) => { const [y, m, d] = iso.split('-').map(Number); return new Date(y, m - 1, d); };
const fmtDate = (iso) => parseISO(iso).toLocaleDateString('ar-IQ', { year: 'numeric', month: 'long', day: 'numeric' });
const weekdayOf = (iso) => WEEKDAYS[parseISO(iso).getDay()];
const todayAr = () => fmtDate(localISO(new Date()));
// الأيام الافتراضية: الأحد إلى الخميس امتحان، والجمعة والسبت عطلة
function buildDays(startIso, count = 21) {
  const start = parseISO(startIso);
  return Array.from({ length: count }, (_, i) => {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    const day = d.getDay();
    return { iso: localISO(d), exam: day !== 5 && day !== 6 };
  });
}

function loadStored(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? { ...fallback, ...JSON.parse(raw) } : fallback;
  } catch (e) { return fallback; }
}
function saveStored(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* التخزين غير متاح */ }
}
function useStored(key, fallback) {
  const [value, setValue] = useState(() => loadStored(key, fallback));
  useEffect(() => saveStored(key, value), [key, value]);
  return [value, setValue];
}
function useToast() {
  const [msg, setMsg] = useState('');
  const timer = useRef(null);
  const notify = useCallback((m) => {
    setMsg(m);
    clearTimeout(timer.current);
    timer.current = setTimeout(() => setMsg(''), 2800);
  }, []);
  return [msg, notify];
}

/* ---------- خلية قابلة للتحرير داخل الصفحة ---------- */
function EditCell({ value = '', onChange, multiline = false, placeholder = '', className = '', style, cellId }) {
  const ref = useRef(null);
  useEffect(() => {
    const el = ref.current;
    // نحدّث النص من الحالة فقط عندما لا يكون الحقل في التركيز (حتى لا يقفز المؤشر)
    if (el && document.activeElement !== el && el.innerText !== value) el.innerText = value;
  }, [value]);
  return (
    <div
      ref={ref}
      contentEditable
      suppressContentEditableWarning
      spellCheck={false}
      role="textbox"
      aria-label={placeholder || 'نص قابل للتعديل'}
      data-ph={placeholder}
      data-cell={cellId}
      className={`outline-none ${className}`}
      style={style}
      onInput={(e) => {
        let t = e.currentTarget.innerText;
        if (!multiline) t = t.replace(/\n/g, '');
        if (t === '\n') t = '';
        onChange(t);
      }}
      onKeyDown={(e) => { if (!multiline && e.key === 'Enter') e.preventDefault(); }}
      onPaste={(e) => {
        e.preventDefault();
        let t = e.clipboardData.getData('text/plain');
        if (!multiline) t = t.replace(/\s*\n\s*/g, ' ');
        document.execCommand('insertText', false, t);
      }}
    />
  );
}

/* ---------- الصفحة A4 مع تصغير تلقائي للشاشات الصغيرة ---------- */
function Sheet({ innerRef, className = '', children, font = 'Cairo' }) {
  const wrapRef = useRef(null);
  const [scale, setScale] = useState(1);
  useEffect(() => {
    const el = wrapRef.current;
    if (!el) return;
    const update = () => setScale(Math.min(1, el.clientWidth / PAPER_W));
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, []);
  return (
    <div ref={wrapRef} className="relative w-full" style={{ height: PAPER_H * scale }}>
      <div
        ref={innerRef}
        className={`absolute top-0 left-1/2 bg-white text-slate-900 shadow-xl paper leading-relaxed ${className}`}
        style={{ fontFamily: `'${font}', serif`, width: PAPER_W, height: PAPER_H, transform: `translateX(-50%) scale(${scale})`, transformOrigin: 'top center' }}
      >
        {children}
      </div>
    </div>
  );
}

/* ---------- التصدير ---------- */
async function renderCanvas(node) {
  const prev = { transform: node.style.transform, left: node.style.left };
  node.style.transform = 'none';
  node.style.left = '0px';
  try {
    await new Promise((r) => requestAnimationFrame(() => r()));
    return await html2canvas(node, { scale: 3, backgroundColor: '#ffffff', useCORS: true, logging: false });
  } finally {
    node.style.transform = prev.transform;
    node.style.left = prev.left;
  }
}
const canvasBlob = (canvas) => new Promise((resolve) => canvas.toBlob(resolve, 'image/png'));
function downloadBlob(blob, fileName) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function makePdfBlob(canvas) {
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
  pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 210, 297);
  return pdf.output('blob');
}
// kind: 'share' (مشاركة) | 'pdf' | 'png' (تحميل/حفظ)
// على الآيفون تفتح نافذة المشاركة الأصلية (حفظ في الملفات أو الصور أو إرسال).
// إذا تعذّرت، تفتح نافذة معاينة فيها روابط مباشرة تعمل بضغطة واحدة.
async function runExport(kind, node, base, notify) {
  const canvas = await renderCanvas(node);
  const png = await canvasBlob(canvas);
  const pdf = makePdfBlob(canvas);
  const pngFile = new File([png], base + '.png', { type: 'image/png' });
  const pdfFile = new File([pdf], base + '.pdf', { type: 'application/pdf' });
  const file = kind === 'png' ? pngFile : pdfFile;

  if ((kind === 'share' || isIOS) && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: base });
      notify(kind === 'share' ? 'تمت المشاركة' : 'اختر "حفظ في الملفات" أو "حفظ الصورة"');
      return;
    } catch (e) {
      if (e && e.name === 'AbortError') return;
      // نكمل إلى البديل
    }
  }
  if (!isIOS && kind !== 'share') {
    downloadBlob(kind === 'png' ? png : pdf, file.name);
    notify(kind === 'png' ? 'تم تحميل الصورة' : 'تم تحميل ملف PDF');
    return;
  }
  window.dispatchEvent(new CustomEvent('export-preview', { detail: { base, png, pdf, kind } }));
}

function DayWizard({ data, setData, notify }) {

  const examCount = data.wDays.filter((x) => x.exam).length;

  const apply = () => {
    const exams = data.wDays.filter((x) => x.exam);
    if (!exams.length) { notify('لا توجد أيام امتحان محددة'); return; }
    if (exams.length > MAX_ROWS) notify(`الجدول يتسع لـ ${MAX_ROWS} يوماً، تم تطبيق أول ${MAX_ROWS}`);
    const list = exams.slice(0, MAX_ROWS);
    setData((d) => ({
      ...d,
      rows: list.map((x, i) => ({ ...(d.rows[i] || emptyRow()), day: weekdayOf(x.iso), date: fmtDate(x.iso) })),
    }));
    setTimeout(() => {
      const el = document.querySelector(`[data-cell="0-${data.wCol}"]`);
      if (el) el.focus();
    }, 120);
    notify('تم تعبئة الأيام والتواريخ، ابدأ بإدخال المواد');
  };

  return (
    <section className="card space-y-4">
      <div className="flex items-center gap-2 font-bold text-slate-800"><Icon name="wand" /> معالج الأيام والتواريخ</div>
      <p className="text-sm text-slate-600">
        اختر تاريخ أول يوم، ثم حدّد الأيام التي فيها امتحان. الجمعة والسبت عطلة افتراضياً. عند التطبيق تُملأ الأيام والتواريخ تلقائياً.
      </p>
      <div className="grid gap-4 md:grid-cols-2">
        <div>
          <label className="label" htmlFor="w-start">تاريخ أول يوم امتحان</label>
          <input id="w-start" type="date" className="field" value={data.wStart} onChange={(e) => e.target.value && setStart(e.target.value)} />
        </div>
        <div>
          <label className="label" htmlFor="w-col">أول عمود تبدأ فيه التعبئة</label>
          <select id="w-col" className="field" value={data.wCol} onChange={(e) => setData((d) => ({ ...d, wCol: e.target.value }))}>
            {['a', 'b', 'c'].map((k, i) => <option key={k} value={k}>{data.headers[i + 2]}</option>)}
          </select>
        </div>
      </div>
      <div>
        <p className="label">هل يوجد امتحان في هذا اليوم؟ (اضغط لتغيير الحالة)</p>
        <div className="flex flex-wrap gap-2">
          {data.wDays.map((x, i) => (
            <button
              key={x.iso}
              onClick={() => toggle(i)}
              aria-pressed={x.exam}
              className={`rounded-lg border px-3 py-1.5 text-sm transition ${x.exam ? 'border-emerald-600 bg-emerald-50 text-emerald-800' : 'border-slate-300 bg-slate-50 text-slate-400 line-through'}`}
            >
              <span className="font-bold">{weekdayOf(x.iso)}</span> {fmtDate(x.iso)}
            </button>
          ))}
        </div>
        <p className="mt-2 text-sm text-slate-500">عدد أيام الامتحان المحددة: {examCount}</p>
      </div>
      <button className="btn btn-primary" onClick={apply}><Icon name="wand" /> تطبيق على الجدول</button>
    </section>
  );
}

function ExamTab({ notify }) {
  const [data, setData] = useStored('mustaqbal-exam-v2', EXAM_INIT);
  const [name, setName] = useState('جدول الامتحانات');
  const [busy, setBusy] = useState(false);
  const paperRef = useRef(null);
  const setRows = (fn) => setData((d) => ({ ...d, rows: fn(d.rows) }));

  const doExport = async (kind) => {
    if (!paperRef.current) return;
    setBusy(true);
    try { await runExport(kind, paperRef.current, cleanName(name), notify); }
    catch (e) { if (e && e.name !== 'AbortError') { notify('تعذّر التصدير، حاول مرة أخرى'); console.error(e); } }
    finally { setBusy(false); }
  };

  return (
    <div className="space-y-5">
      <DayWizard data={data} setData={setData} notify={notify} />
      <TypeControls data={data} setData={setData} />

      <section className="card space-y-4">
        <div className="flex items-center gap-2 font-bold text-slate-800"><Icon name="palette" /> التصميم واللون</div>
        <div className="grid grid-cols-2 gap-3">
          {Object.keys(EXAM_DESIGNS).map((key) => (
            <button key={key} aria-pressed={data.design === key} onClick={() => setData((d) => ({ ...d, design: key }))}
              className={`rounded-xl border-2 p-3 text-center transition ${data.design === key ? 'border-[#b08d3a] bg-amber-50' : 'border-slate-200 hover:border-slate-400'}`}>
              <div className={`mx-auto mb-2 h-[60px] w-full max-w-[160px] overflow-hidden ${key === 'soft' ? 'rounded-lg border border-slate-300' : 'border border-slate-600'}`}>
                <div className="h-3" style={{ background: key === 'soft' ? data.color : data.color + '1f', borderBottom: key === 'grid' ? '1px solid #475569' : 'none' }} />
                <div className="grid grid-cols-3 gap-px bg-slate-300 p-px">
                  {Array.from({ length: 9 }, (_, i) => <div key={i} className="h-[12px] bg-white" />)}
                </div>
              </div>
              <div className="text-sm font-semibold">{EXAM_DESIGNS[key]}</div>
            </button>
          ))}
        </div>
        <div>
          <p className="label">لون الترويسة</p>
          <Swatches value={data.color} onChange={(c) => setData((d) => ({ ...d, color: c }))} />
        </div>
      </section>

      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex gap-2">
          <button className="btn btn-ghost" disabled={data.rows.length >= MAX_ROWS} onClick={() => setRows((rs) => [...rs, emptyRow()])}><Icon name="plus" /> إضافة صف</button>
          <button className="btn btn-ghost" disabled={data.rows.length <= 1} onClick={() => setRows((rs) => rs.slice(0, -1))}><Icon name="minus" /> حذف آخر صف</button>
        </div>
        <button className="btn btn-ghost" onClick={() => { if (window.confirm('هل تريد مسح كل محتوى الجدول؟')) setRows(() => emptyRows(10)); }}>
          <Icon name="trash" /> مسح الجدول
        </button>
      </div>
      <p className="text-sm text-slate-500">يمكنك الكتابة مباشرة في أي خلية أو عنوان داخل الجدول.</p>

      <div className="overflow-x-auto rounded-2xl bg-slate-200/70 p-3 md:p-6">
        <ExamPaper data={data} setData={setData} innerRef={paperRef} />
      </div>

      <ExportBar name={name} setName={setName} onExport={doExport} busy={busy} inputId="exam-name" />
    </div>
  );
}

/* ---------- تحويل الصور إلى PDF ---------- */
const loadImg = (src) => new Promise((resolve, reject) => {
  const im = new Image();
  im.onload = () => resolve(im);
  im.onerror = () => reject(new Error('تعذّر فتح الصورة'));
  im.src = src;
});
function ImageToPdfTab({ notify }) {
  const [items, setItems] = useState([]);
  const [name, setName] = useState('ملف-الصور');
  const [busy, setBusy] = useState(false);
  const inputRef = useRef(null);

  const addFiles = (files) => {
    const list = Array.from(files || []).filter((f) => f.type.startsWith('image/'));
    if (!list.length) { notify('اختر ملفات صور فقط'); return; }
    setItems((prev) => [...prev, ...list.map((f) => ({ id: Math.random().toString(36).slice(2), file: f, url: URL.createObjectURL(f) }))]);
  };
  const remove = (id) => setItems((prev) => {
    const it = prev.find((x) => x.id === id);
    if (it) URL.revokeObjectURL(it.url);
    return prev.filter((x) => x.id !== id);
  });
  const clearAll = () => {
    items.forEach((it) => URL.revokeObjectURL(it.url));
    setItems([]);
  };
  const move = (i, dir) => setItems((prev) => {
    const j = i + dir;
    if (j < 0 || j >= prev.length) return prev;
    const n = [...prev];
    [n[i], n[j]] = [n[j], n[i]];
    return n;
  });

  const toPdf = async () => {
    if (!items.length) return;
    setBusy(true);
    try {
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      const PW = 210, PH = 297, M = 10;
      for (let i = 0; i < items.length; i++) {
        const img = await loadImg(items[i].url);
        const c = document.createElement('canvas');
        c.width = img.naturalWidth;
        c.height = img.naturalHeight;
        c.getContext('2d').drawImage(img, 0, 0);
        const ratio = Math.min((PW - 2 * M) / c.width, (PH - 2 * M) / c.height);
        const w = c.width * ratio, h = c.height * ratio;
        if (i > 0) pdf.addPage();
        pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', (PW - w) / 2, (PH - h) / 2, w, h);
      }
      const base = cleanName(name);
      const blob = pdf.output('blob');
      const file = new File([blob], base + '.pdf', { type: 'application/pdf' });
      if (isIOS && navigator.canShare && navigator.canShare({ files: [file] })) {
        try {
          await navigator.share({ files: [file], title: base });
          notify('اختر "حفظ في الملفات" أو أي تطبيق تريده');
          return;
        } catch (e) { if (e && e.name === 'AbortError') return; }
      }
      pdf.save(base + '.pdf');
      notify('تم إنشاء ملف PDF');
    } catch (e) {
      notify('تعذّر التحويل، تأكد من الصور وحاول مرة أخرى');
      console.error(e);
    } finally {
      setBusy(false);
    }
  };

  return (
    <div className="space-y-5">
      <section className="card space-y-4">
        <h3 className="flex items-center gap-2 font-bold text-slate-800"><Icon name="file" /> تحويل الصور إلى PDF</h3>
        <p className="text-sm text-slate-600">اختر صورة واحدة أو أكثر. كل صورة تصير في صفحة A4 مستقلة، وتبقى نسبة الصورة كما هي.</p>
        <input ref={inputRef} type="file" accept="image/*" multiple className="hidden"
          onChange={(e) => { addFiles(e.target.files); e.target.value = ''; }} />
        <button className="btn btn-primary" onClick={() => inputRef.current && inputRef.current.click()}><Icon name="plus" /> اختيار صور</button>
      </section>

      {items.length > 0 && (
        <section className="card space-y-4">
          <p className="text-sm font-bold text-slate-700">عدد الصفحات: {items.length}</p>
          <div className="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4">
            {items.map((it, i) => (
              <div key={it.id} className="rounded-xl border border-slate-200 p-2">
                <img src={it.url} alt={'صفحة ' + (i + 1)} className="h-28 w-full rounded object-cover" />
                <div className="mt-2 flex items-center justify-between gap-1 text-sm">
                  <span className="font-bold">صفحة {i + 1}</span>
                  <span className="flex gap-1">
                    <button className="btn btn-ghost text-xs" onClick={() => move(i, -1)} disabled={i === 0} aria-label="تحريك للأعلى">↑</button>
                    <button className="btn btn-ghost text-xs" onClick={() => move(i, 1)} disabled={i === items.length - 1} aria-label="تحريك للأسفل">↓</button>
                    <button className="btn btn-ghost text-xs" onClick={() => remove(it.id)} aria-label="حذف الصورة"><Icon name="trash" size={14} /></button>
                  </span>
                </div>
              </div>
            ))}
          </div>
          <div>
            <label className="label" htmlFor="img-name">اسم ملف PDF</label>
            <input id="img-name" className="field" value={name} onChange={(e) => setName(e.target.value)} />
          </div>
          <div className="flex flex-wrap gap-2">
            <button className="btn btn-primary" disabled={busy} onClick={toPdf}><Icon name="download" /> تحويل وتحميل PDF</button>
            <button className="btn btn-ghost" disabled={busy} onClick={clearAll}><Icon name="trash" /> مسح الكل</button>
          </div>
          {busy && <p className="text-sm text-slate-500">جاري التحويل…</p>}
        </section>
      )}
    </div>
  );
}

/* ---------- نافذة المعاينة والحفظ (للآيفون والمتصفحات التي لا تدعم المشاركة) ---------- */
function PreviewModal({ data, onClose }) {
  const urls = useMemo(() => (data ? { png: URL.createObjectURL(data.png), pdf: URL.createObjectURL(data.pdf) } : null), [data]);
  useEffect(() => () => { if (urls) { URL.revokeObjectURL(urls.png); URL.revokeObjectURL(urls.pdf); } }, [urls]);
  if (!data || !urls) return null;
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center bg-slate-900/60 p-4" role="dialog" aria-modal="true">
      <div className="max-h-[92vh] w-full max-w-lg overflow-y-auto rounded-2xl bg-white p-5 shadow-2xl">
        <div className="mb-3 flex items-center justify-between">
          <h3 className="font-bold text-slate-800">حفظ أو مشاركة الملف</h3>
          <button className="btn btn-ghost" onClick={onClose}>إغلاق</button>
        </div>
        <img src={urls.png} alt="معاينة الصفحة" className="mx-auto mb-4 max-h-[50vh] w-auto rounded border border-slate-200" />
        <div className="grid gap-2 sm:grid-cols-2">
          <a href={urls.pdf} target="_blank" rel="noopener" download={data.base + '.pdf'} className="btn btn-primary justify-center">تحميل PDF</a>
          <a href={urls.png} target="_blank" rel="noopener" download={data.base + '.png'} className="btn btn-ghost justify-center">تحميل صورة (PNG)</a>
        </div>
        <div className="mt-4 space-y-1 text-sm text-slate-600">
          <p><b>على الآيفون:</b> اضغط مطولاً على الصورة واختر "حفظ الصورة" لإضافتها إلى الصور.</p>
          <p>أو افتح ملف PDF، ثم اضغط زر المشاركة <b>⬆</b> في سفاري واختر "حفظ في الملفات" أو أي تطبيق تريده.</p>
        </div>
      </div>
    </div>
  );
}

/* ---------- التطبيق ---------- */
function App() {
  const [tab, setTab] = useState('letter');
  const [toastMsg, notify] = useToast();
  const [preview, setPreview] = useState(null);
  useEffect(() => {
    const onPreview = (e) => setPreview(e.detail);
    window.addEventListener('export-preview', onPreview);
    return () => window.removeEventListener('export-preview', onPreview);
  }, []);
  const tabs = [
    { id: 'letter', label: 'الكتب الرسمية', icon: 'letter' },
    { id: 'exam', label: 'جداول الامتحانات', icon: 'table' },
    { id: 'img', label: 'صورة إلى PDF', icon: 'file' },
  ];
  return (
    <div className="min-h-screen">
      <header className="bg-[#1e3a5f] text-white shadow-md">
        <div className="mx-auto flex max-w-5xl items-center gap-3 px-4 py-5">
          <div className="rounded-xl border border-[#b08d3a] p-2 text-[#d9b65f]"><Icon name="file" size={26} /></div>
          <div>
            <h1 className="text-xl font-extrabold md:text-2xl">متوسطة المستقبل للبنين</h1>
            <p className="text-sm text-slate-300">الكتب الرسمية وجداول الامتحانات</p>
          </div>
        </div>
        <div className="h-[3px] bg-[#b08d3a]" />
      </header>

      <nav className="sticky top-0 z-20 border-b border-slate-200 bg-white/95 backdrop-blur" role="tablist">
        <div className="mx-auto flex max-w-5xl gap-2 px-4 py-3">
          {tabs.map((t) => (
            <button key={t.id} role="tab" aria-selected={tab === t.id} onClick={() => setTab(t.id)}
              className={`btn flex-1 justify-center md:flex-none ${tab === t.id ? 'btn-primary' : 'btn-ghost'}`}>
              <Icon name={t.icon} /> {t.label}
            </button>
          ))}
        </div>
      </nav>

      <main className="mx-auto max-w-5xl px-4 py-6">
        {tab === 'letter' ? <LetterTab notify={notify} /> : tab === 'exam' ? <ExamTab notify={notify} /> : <ImageToPdfTab notify={notify} />}
      </main>

      <PreviewModal data={preview} onClose={() => setPreview(null)} />
      {toastMsg && (
        <div role="status" className="fixed bottom-5 left-1/2 z-50 -translate-x-1/2 rounded-xl bg-slate-800 px-4 py-2 text-sm text-white shadow-lg">
          {toastMsg}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
